# Локальный PostgreSQL для разработки и тестов.
# Порт 5434: 5432 занят системным PostgreSQL, 5433 — другими локальными проектами.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dealfinder
      POSTGRES_PASSWORD: dealfinder_local
      POSTGRES_DB: deal_finder
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealfinder -d deal_finder"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
